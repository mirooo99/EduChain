<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <title>EduChain | Blockchain Verification</title>
    <meta name="description" content="Децентрализирана платформа за верификация на сертификати в Ethereum, създадена от Мирослав Радуканов." />
    <style>
      body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
      .container { max-width: 800px; margin: 0 auto; padding: 20px; }
      input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
      button { background-color: #007bff; color: white; cursor: pointer; border: none; }
      button:hover { background-color: #0056b3; }
      
      /* Малък трик: скриваме лентата на Google, която понякога се появява най-отгоре */
      .goog-te-banner-frame.skiptranslate { display: none !important; } 
      body { top: 0px !important; }
    </style>
  </head>
  <body>
    <noscript>Трябва да включите JavaScript, за да стартирате това приложение.</noscript>
    
    <div id="root"></div>

    <div id="google_translate_element" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'bg',
          includedLanguages: 'en,de,ru', // Можеш да добавиш още езици тук
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  </body>
</html>
