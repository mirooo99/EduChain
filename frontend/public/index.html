<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="google-site-verification" content="0VC7kuxOv4ju6xJMFQapty8r0NUq4sdDGbIHrYTJ-yA" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <title>EduChain | Blockchain Verification</title>
    <meta name="description" content="Децентрализирана платформа за верификация на сертификати в Ethereum, създадена от Мирослав Радуканов." />
    
    <style>
      body { 
        font-family: Arial, sans-serif; 
        background-color: #f4f4f9; 
        margin: 0; 
        padding: 0; 
        top: 0px !important;
        position: static !important;
      }
      
      .container { max-width: 800px; margin: 0 auto; padding: 20px; }
      input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
      button { background-color: #007bff; color: white; cursor: pointer; border: none; }
      button:hover { background-color: #0056b3; }

      .goog-te-banner-frame.skiptranslate, 
      .goog-te-banner-frame, 
      #goog-gt-tt, 
      .goog-te-balloon-frame,
      iframe.goog-te-banner-frame { 
        display: none !important; 
        visibility: hidden !important;
      }

      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }

      body { 
        top: 0px !important; 
      }
    </style>
  </head>
  <body dir="ltr">
    <noscript>Трябва да включите JavaScript, за да стартирате това приложение.</noscript>
    
    <div id="root"></div>

    <div id="google_translate_element" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'bg',
          includedLanguages: 'en,de,ru,fr,es,it,ar,bg',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');

        setInterval(function() {
            if (document.body.style.top !== "0px") {
                document.body.style.top = "0px";
            }
        }, 100);
      }
    </script>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  </body>
</html>
